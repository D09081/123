<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf2f1"><title>Админка — Наш маленький мир</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--ink:#402b34;--muted:#907983;--rose:#b96e83;--paper:#fffaf8;--line:#eadde0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui;padding:18px}.wrap{max-width:760px;margin:auto}.top{color:var(--muted);font-size:11px;letter-spacing:2px}.panel{background:#f9eff0;border:1px solid #f0e2e5;border-radius:20px;padding:20px;margin:16px 0}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:34px}h2{font-size:25px;margin:6px 0 16px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px;background:white;color:var(--ink);font:inherit}label{font-size:12px;color:var(--muted)}button{border:1px solid var(--line);border-radius:24px;padding:11px 16px;background:white;color:var(--ink);font-weight:650}button.primary{background:var(--rose);color:white;border-color:var(--rose)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:13px}.hidden{display:none}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top">♥ OUR LITTLE WORLD / ADMIN</div><h1>Твоя семейная панель</h1><p class="muted">Управляй идеями, планами и сообщениями для вашей семьи.</p><div id="status" class="panel">Проверяем доступ через Telegram…</div><div id="app" class="hidden">
<section class="panel"><h2>Добавить новую идею</h2><div class="row"><label>Эмодзи<input id="emoji" value="💗"></label><label>Название<input id="title" placeholder="Например, семейный завтрак"></label></div><label>Описание<textarea id="description" rows="2"></textarea></label><label>Подсказка<textarea id="tip" rows="2"></textarea></label><div class="row"><label>Настроение<select id="mood"><option value="cozy">Уютное</option><option value="active">Активное</option><option value="romantic">Романтичное</option><option value="fun">Весёлое</option></select></label><label>Кому<select id="who"><option value="all">Всем</option><option value="baby">С малышом</option><option value="couple">Вдвоём</option><option value="mom">Алине</option><option value="dad">Папе</option></select></label></div><div class="row"><label>Бюджет<select id="budget"><option value="free">Бесплатно</option><option value="low">До 1000 ₽</option><option value="home">Дома</option></select></label><label>Время<select id="duration"><option value="short">До 30 минут</option><option value="medium">30–90 минут</option><option value="long">Больше часа</option></select></label></div><button class="primary" id="add">Сохранить идею ♥</button></section>
<section class="panel"><h2>Идеи в приложении</h2><div id="ideas"></div></section>
<section class="panel"><h2>Сообщение семье</h2><p class="muted">Отправка через бота пользователям, которые уже открывали Mini App.</p><textarea id="announcement" rows="3" placeholder="Напиши тёплое сообщение…"></textarea><button class="primary" id="send">Отправить через бота</button></section>
<section class="panel"><h2>Семейная статистика</h2><div id="stats" class="muted"></div></section>
</div></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const headers={'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''};const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers,...opts.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
function say(s){$('status').textContent=s}
async function refresh(){const d=await api('/api/admin/overview');$('app').classList.remove('hidden');$('status').classList.add('hidden');$('ideas').innerHTML='';d.ideas.forEach(x=>{const el=document.createElement('div');el.className='item';const span=document.createElement('span');span.textContent=(x.emoji||'💗')+' '+x.title;const b=document.createElement('button');b.textContent='Удалить';b.onclick=async()=>{if(confirm('Удалить эту идею?')){await api('/api/admin/ideas/'+x.id,{method:'DELETE'});refresh()}};el.append(span,b);$('ideas').append(el)});$('stats').textContent='Пользователей: '+d.users.length+' · Сохранённых планов: '+d.savedCount+' · Воспоминаний: '+d.memoriesCount}
$('add').onclick=async()=>{try{await api('/api/admin/ideas',{method:'POST',body:JSON.stringify({emoji:$('emoji').value,title:$('title').value,description:$('description').value,tip:$('tip').value,mood:$('mood').value,who:$('who').value,budget:$('budget').value,duration:$('duration').value})});$('title').value='';$('description').value='';$('tip').value='';await refresh();alert('Идея добавлена ♥')}catch(e){alert(e.message)}};
$('send').onclick=async()=>{try{const d=await api('/api/admin/announcement',{method:'POST',body:JSON.stringify({text:$('announcement').value})});alert('Отправлено. Получателей: '+d.recipients)}catch(e){alert(e.message)}};
(async()=>{try{await refresh()}catch(e){say(e.message+' Открой эту страницу из Telegram Mini App под своим аккаунтом.')}})();
</script></body></html>
